[project]
name = "kazoo"
version = "0.1.0"
description = "CLI for Kuzu graph databases — query, schema management, JSON output"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rob Hurring" }]
dependencies = [
    "kuzu>=0.6.0",
    "typer>=0.12.0",
]

[project.scripts]
kazoo = "kazoo.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kazoo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
